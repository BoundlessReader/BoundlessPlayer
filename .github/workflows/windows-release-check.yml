name: Windows release check

# Installs the published Windows release the way a person does, with the one line command of the README, on a clean Windows runner, then
# runs the installed app's self check. The second run of the command must say that nothing is left to do. Manual only: Actions, Windows
# release check, Run workflow. It reads only public files, so it needs no secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # libmpv imports vulkan-1.dll, which a graphics driver brings to a PC. The runner is a bare virtual machine without one, on purpose: the
      # installer carries a copy and the engine has to manage with that. Should an image ever have one, this stops the run, since a pass
      # would then not show that the copy works.
      - name: Check that the runner has no Vulkan loader of its own
        shell: pwsh
        run: |
          $dll = Join-Path $env:SystemRoot 'System32\vulkan-1.dll'
          "vulkan-1.dll in System32: $(Test-Path $dll)"
          if (Test-Path $dll) { 'the runner has a Vulkan loader of its own, so a pass would not show that the copy of the installer works'; exit 1 }
      - name: Run the one line installer
        shell: pwsh
        run: |
          $env:BOUNDLESS_PLAIN = '1'
          $env:BOUNDLESS_INSTALL_LOG = Join-Path $env:RUNNER_TEMP 'install-1.log'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/BoundlessReader/BoundlessPlayer/main/install.ps1 | iex"
          '--- install log'
          Get-Content $env:BOUNDLESS_INSTALL_LOG | Select-Object -Last 40
          $exe = Join-Path $env:LOCALAPPDATA 'Boundless Player App\Boundless Player.exe'
          if (-not (Test-Path $exe)) { 'the command did not install the app'; exit 1 }
          "installed product version: $((Get-Item $exe).VersionInfo.ProductVersion)"
      - name: Run the installed app's self check
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Boundless Player App'
          foreach ($f in 'app\resources\vulkan\vulkan-1.dll', 'app\resources\licenses\LICENSE-Vulkan-Loader.txt', 'app\resources\licenses\Vulkan-Loader-NOTICE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { "missing from the install: $f"; exit 1 }
          }
          $run = Start-Process -FilePath (Join-Path $dir 'Boundless Player.exe') -ArgumentList '--smoke' -PassThru
          if ($run.WaitForExit(240000)) { $code = $run.ExitCode } else { $run.Kill(); 'the self check did not finish in 4 minutes'; $code = 1 }
          $report = Join-Path $env:LOCALAPPDATA 'Boundless Player\smoke.txt'
          if (Test-Path $report) { Get-Content $report } else { 'no smoke.txt was written' }
          "self check exit code: $code"
          if ($code -eq 0 -and -not (Select-String -Path $report -Pattern 'Vulkan loader the installer carries' -Quiet)) { 'the engine did not use the loader of the installer'; exit 1 }
          exit $code
      # The release notes carry the build number of the Windows files, which is how the script knows that what it installed is what it sees.
      - name: Run the command again, it must have nothing to do
        shell: pwsh
        run: |
          $env:BOUNDLESS_PLAIN = '1'
          $env:BOUNDLESS_INSTALL_LOG = Join-Path $env:RUNNER_TEMP 'install-2.log'
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/BoundlessReader/BoundlessPlayer/main/install.ps1 | iex" 2>&1 | Out-String
          $out
          if ($out -notmatch 'Nothing to do') { 'the second run installed again instead of saying that nothing was left to do'; exit 1 }
