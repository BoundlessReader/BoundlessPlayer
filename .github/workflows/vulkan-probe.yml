name: Vulkan probe

# A probe, run by hand: how a Vulkan loader gets onto a Windows runner without a window to click. Removed once the answer is in.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Download the SDK installer
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          foreach ($v in '1.3.296.0', '1.3.290.0', '1.3.283.0') {
            try {
              Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe" -OutFile $exe -UseBasicParsing
              "sdk $v, $((Get-Item $exe).Length) bytes"; break
            } catch { "no sdk $v ($($_.Exception.Message))" }
          }
      - name: Install the core component without a window, six minutes at most
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          $p = Start-Process $exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'com.lunarg.vulkan.core' -PassThru
          if ($p.WaitForExit(360000)) { "exit code $($p.ExitCode)" } else { 'still running after six minutes, stopped'; Stop-Process -Id $p.Id -Force }
          Get-ChildItem C:\VulkanSDK -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem C:\VulkanSDK -Recurse -Filter 'vulkan-1.dll' -ErrorAction SilentlyContinue | Select-Object FullName, Length
          "vulkan-1.dll in System32: $(Test-Path (Join-Path $env:SystemRoot 'System32\vulkan-1.dll'))"
  vcpkg:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Build the Khronos loader with vcpkg
        shell: pwsh
        continue-on-error: true
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install vulkan-loader:x64-windows --clean-after-build 2>&1 | Select-Object -Last 30
          Get-ChildItem $env:VCPKG_INSTALLATION_ROOT\installed -Recurse -Filter 'vulkan-1.dll' -ErrorAction SilentlyContinue | Select-Object FullName, Length
