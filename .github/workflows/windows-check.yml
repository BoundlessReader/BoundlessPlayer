name: Windows check

# Takes the installers a finished Windows installer run kept (they stay for 3 days) and checks them on a Windows runner without building
# again: where a plain install puts the app, the installer script, the self check of the installed app and an opened window.
# Manual only: Actions, Windows check, Run workflow. The source is private and is read with PLAYER_SOURCE_TOKEN, a read only token.
on:
  workflow_dispatch:
    inputs:
      run:
        description: Id of the Windows installer run whose files to check
        required: true
      ref:
        description: Source ref of the installer script, a branch, tag or commit (defaults to main)
        required: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out the installer script
        uses: actions/checkout@v4
        with:
          repository: BoundlessReader/boundless-player-app
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PLAYER_SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: installer
      - name: Get the installers of the run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: |
          set -euo pipefail
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n windows-installers -D out
          ls -l out
      # What a person gets from double clicking the MSI: msiexec with no property of ours.
      - name: Install the MSI as it comes and see where it went
        shell: pwsh
        continue-on-error: true
        run: |
          $msi = (Get-ChildItem out/*.msi | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'msi-plain.log'
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          "msiexec exit code: $($p.ExitCode)"
          '--- folders of the user'
          Get-ChildItem $env:LOCALAPPDATA -Directory | Select-Object -ExpandProperty Name
          '--- the program, searched'
          Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)} -Recurse -Depth 4 -Filter 'Boundless Player.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          '--- uninstall entries'
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Boundless*' } | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString
          $expected = Join-Path $env:LOCALAPPDATA 'Programs\Boundless Player\Boundless Player.exe'
          "the app is where the installer script and Update now expect it: $(Test-Path $expected)"
          '--- what the install log says about places and scope'
          Select-String -Path $log -Pattern 'INSTALLDIR|TARGETDIR|ALLUSERS|MSIINSTALLPERUSER|InstallScope|LocalAppDataFolder|ProgramFiles64Folder' | Select-Object -First 40 | ForEach-Object { $_.Line.Trim() }
      - name: Remove it again
        shell: pwsh
        continue-on-error: true
        run: |
          $msi = (Get-ChildItem out/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          "msiexec /x exit code: $($p.ExitCode)"
      - name: Install with the installer script
        shell: pwsh
        continue-on-error: true
        run: |
          $msi = (Get-ChildItem out/*.msi | Select-Object -First 1).FullName
          $data = Join-Path $env:LOCALAPPDATA 'Boundless Player'
          New-Item -ItemType Directory -Force $data | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $data 'boundless.db'), (New-Object byte[] 4096))
          $env:BOUNDLESS_LOCAL_MSI = $msi
          $env:BOUNDLESS_PLAIN = '1'
          $env:BOUNDLESS_INSTALL_LOG = Join-Path $env:RUNNER_TEMP 'install.log'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw installer/install.ps1 | Invoke-Expression"
          '--- install log'
          Get-Content $env:BOUNDLESS_INSTALL_LOG
          '--- install folder'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Boundless Player'
          Get-ChildItem $dir | Format-Table Name, Length -AutoSize
          if (-not (Test-Path (Join-Path $dir 'Boundless Player.exe'))) { 'the script did not install the app'; exit 1 }
          if (-not (Get-ChildItem (Join-Path $data 'backups') -Recurse -Filter boundless.db -ErrorAction SilentlyContinue)) { 'the script did not save the library'; exit 1 }
          'the app is installed and the library was saved'
          Remove-Item (Join-Path $data 'boundless.db')
      # What the video engine needs: the DLL, what it imports, and which of those this PC does not have.
      - name: Where the video engine stands
        shell: pwsh
        continue-on-error: true
        run: |
          $res = Join-Path $env:LOCALAPPDATA 'Programs\Boundless Player\app\resources'
          Get-ChildItem $res -File | Format-Table Name, Length -AutoSize
          $dll = Join-Path $res 'libmpv-2.dll'
          "libmpv-2.dll present: $(Test-Path $dll)"
          "vulkan-1.dll in System32: $(Test-Path (Join-Path $env:SystemRoot 'System32\vulkan-1.dll'))"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) {
            $deps = & $dumpbin.FullName /dependents $dll | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            foreach ($d in $deps) {
              $found = (Test-Path (Join-Path $env:SystemRoot "System32\$d")) -or (Test-Path (Join-Path $res $d)) -or ($d -like 'api-ms-win-*')
              '{0,-28} {1}' -f $d, $(if ($found) { 'found' } else { 'MISSING' })
            }
          } else { 'dumpbin was not found' }
          Add-Type -Namespace Probe -Name Ldr -MemberDefinition '[DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags);'
          $h = [Probe.Ldr]::LoadLibraryEx($dll, [IntPtr]::Zero, 8)
          "LoadLibraryEx handle $h, error $([Runtime.InteropServices.Marshal]::GetLastWin32Error()) (126 is a missing module, 193 a wrong kind of file)"
      - name: Run the self check of the installed app
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Boundless Player'
          $run = Start-Process -FilePath (Join-Path $dir 'Boundless Player.exe') -ArgumentList '--smoke' -PassThru
          if ($run.WaitForExit(240000)) { $code = $run.ExitCode } else { $run.Kill(); 'the self check did not finish in 4 minutes'; $code = 1 }
          $report = Join-Path $env:LOCALAPPDATA 'Boundless Player\smoke.txt'
          if (Test-Path $report) { Get-Content $report } else { 'no smoke.txt was written' }
          "self check exit code: $code"
          exit $code
      # The Vulkan loader a normal PC gets from its graphics driver. The runner is a bare virtual machine and has none.
      - name: Give the runner a Vulkan loader
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vulkan-runtime.exe'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime.exe' -OutFile $exe -UseBasicParsing
          "downloaded $((Get-Item $exe).Length) bytes"
          $p = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          $dll = Join-Path $env:SystemRoot 'System32\vulkan-1.dll'
          "vulkan-1.dll in System32 now: $(Test-Path $dll)"
          if (-not (Test-Path $dll)) { exit 1 }
      - name: Run the self check again with the loader
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Boundless Player'
          $run = Start-Process -FilePath (Join-Path $dir 'Boundless Player.exe') -ArgumentList '--smoke' -PassThru
          if ($run.WaitForExit(240000)) { $code = $run.ExitCode } else { $run.Kill(); 'the self check did not finish in 4 minutes'; $code = 1 }
          $report = Join-Path $env:LOCALAPPDATA 'Boundless Player\smoke.txt'
          if (Test-Path $report) { Get-Content $report } else { 'no smoke.txt was written' }
          "self check exit code: $code"
          exit $code
      - name: Open the installed app and photograph it
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Runtime.InteropServices; using System.Collections.Generic;
          public class Wnd {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static List<string> ForPid(uint pid) {
              var list = new List<string>();
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid) {
                  var t = new StringBuilder(256); GetWindowText(h, t, 256);
                  var c = new StringBuilder(256); GetClassName(h, c, 256);
                  RECT r; GetWindowRect(h, out r);
                  list.Add("window " + h.ToInt64().ToString("x") + " visible=" + IsWindowVisible(h) + " class=" + c + " title='" + t + "' rect=" + r.L + "," + r.T + "," + r.R + "," + r.B);
                }
                return true;
              }, IntPtr.Zero);
              return list;
            }
          }
          "@
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Boundless Player'
          $p = Start-Process -FilePath (Join-Path $dir 'Boundless Player.exe') -PassThru
          Start-Sleep -Seconds 40
          $p.Refresh()
          $ok = -not $p.HasExited
          if ($ok) { "the app is running, main window title: '$($p.MainWindowTitle)'" } else { "the app exited with code $($p.ExitCode)" }
          [Wnd]::ForPid([uint32]$p.Id)
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $area = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap($area.Width, $area.Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($area.Location, [System.Drawing.Point]::Empty, $area.Size)
            New-Item -ItemType Directory -Force shots | Out-Null
            $bmp.Save((Join-Path (Resolve-Path shots).Path 'app-window.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            "screen: $($area.Width) by $($area.Height)"
            $counts = @{}
            for ($y = 0; $y -lt $area.Height; $y += 8) { for ($x = 0; $x -lt $area.Width; $x += 8) { $k = $bmp.GetPixel($x, $y).ToArgb(); $counts[$k] = 1 + [int]$counts[$k] } }
            $total = ($counts.Values | Measure-Object -Sum).Sum
            "sampled $total pixels, $($counts.Count) distinct colors; the five most common:"
            $counts.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 5 | ForEach-Object { '  #{0:X6}  {1:P1}' -f ($_.Key -band 0xFFFFFF), ($_.Value / $total) }
          } catch { "no picture of the screen: $($_.Exception.Message)" }
          Get-ChildItem $dir -Filter 'hs_err_*.log' | ForEach-Object { "native crash log: $($_.Name)" }
          $data = Join-Path $env:LOCALAPPDATA 'Boundless Player'
          '--- window.properties'
          Get-Content (Join-Path $data 'window.properties') -ErrorAction SilentlyContinue
          '--- logs/startup.txt'
          Get-Content (Join-Path $data 'logs\startup.txt') -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { [void]$p.CloseMainWindow(); if (-not $p.WaitForExit(15000)) { $p.Kill() } }
          if (-not $ok) { exit 1 }
      - name: Keep the picture for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-picture
          path: shots/*
          retention-days: 3
          if-no-files-found: ignore
